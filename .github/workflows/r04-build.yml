name: R09 build and QA07 health regression

on:
  push:
    branches: [main, ci/verification]
    paths:
      - reconstructed/campaigns/C001/**
      - reconstructed/C001DevelopmentChecks/**
      - reconstructed/C001PerfectChecks/**
      - re/campaigns/C001/perfect-circle/**
      - reconstructed/CircleGame/**
      - reconstructed/R06PreparationChecks/**
      - reconstructed/R07DevelopmentChecks/**
      - reconstructed/R08DevelopmentChecks/**
      - reconstructed/R08C01DevelopmentChecks/**
      - reconstructed/R08C02DevelopmentChecks/**
      - reconstructed/R09DevelopmentChecks/**
      - reconstructed/R10DevelopmentChecks/**
      - reconstructed/R11DevelopmentChecks/**
      - reconstructed/R12DevelopmentChecks/**
      - reconstructed/R13DevelopmentChecks/**
      - reconstructed/R13C01DevelopmentChecks/**
      - reconstructed/R14DevelopmentChecks/**
      - reconstructed/R14WindowsChecks/**
      - reconstructed/R14Q01DevelopmentChecks/**
      - reconstructed/R15DevelopmentChecks/**
      - reconstructed/R15WindowsChecks/**
      - reconstructed/R16DevelopmentChecks/**
      - reconstructed/R16WindowsChecks/**
      - reconstructed/R17DevelopmentChecks/**
      - reconstructed/R17WindowsChecks/**
      - reconstructed/GenerateIndependentSpinnerSounds.ps1
      - reconstructed/R13WindowsChecks/**
      - reconstructed/GenerateIndependentSliderLoops.ps1
      - reconstructed/GenerateIndependentSliderTicks.ps1
      - re/qa/qa03/Headless/**
      - re/qa/qa04/Headless/**
      - re/qa/qa05/Headless/**
      - re/qa/qa06/Headless/**
      - re/qa/qa07/Headless/**
      - re/qa/qa08/Headless/**
      - re/qa/qa08/Inputs/**
      - re/qa/qa09/Headless/**
      - re/qa/qa09/Inputs/**
      - re/qa/qa09/Run-QA09.ps1
      - re/qa/qa10/Headless/**
      - re/qa/qa10/Inputs/**
      - re/qa/qa10/Run-QA10.ps1
      - re/qa/qa11/Headless/**
      - re/qa/qa11/Windows/**
      - re/qa/qa11/Inputs/**
      - re/qa/qa11/Run-QA11.ps1
      - re/qa/qa12/Headless/**
      - re/qa/qa12/Windows/**
      - re/qa/qa12/Inputs/**
      - re/qa/qa12/Run-QA12.ps1
      - re/qa/qa13/Headless/**
      - re/qa/qa13/Windows/**
      - re/qa/qa13/Inputs/**
      - re/qa/qa13/Run-QA13.ps1
      - re/qa/qa14/Headless/**
      - re/qa/qa14/Windows/**
      - re/qa/qa14/Inputs/**
      - re/qa/qa14/Run-QA14.ps1
      - re/qa/qa15/**
      - .github/workflows/r04-build.yml

permissions:
  contents: read

jobs:
  build-and-regression:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Checkout exact gate commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select an already installed .NET 8 SDK
        id: sdk
        shell: pwsh
        run: |
          git rev-parse HEAD
          $installed = dotnet --list-sdks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed | Write-Output
          $versions = @($installed | ForEach-Object {
            if ($_ -match '^(8\.0\.\d+)\s') { [version]$Matches[1] }
          } | Sort-Object -Descending)
          if ($versions.Count -eq 0) {
            Write-Error 'QA03 BLOCKED: no preinstalled .NET 8 SDK; no installation attempted.'
            exit 1
          }
          @{ sdk = @{ version = $versions[0].ToString(); rollForward = 'disable'; allowPrerelease = $false } } |
            ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 global.json
          dotnet --version
          exit $LASTEXITCODE

      - name: Compile R07 WPF Windows x64
        id: build
        shell: pwsh
        run: |
          dotnet build reconstructed/CircleGame/Ohno.CircleGame.csproj -c Release -r win-x64 --self-contained false --nologo
          exit $LASTEXITCODE

      - name: Execute independent QA15 corpus and calculator component verification
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa15/Run-QA15.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa15-results.json')
          exit $LASTEXITCODE

      - name: Execute unchanged QA01 headless suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa01/Headless/QA01.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute QA03 slider component suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa03/Headless/QA03.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R06 finite preparation targets and fixture loading
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R06PreparationChecks/R06PreparationChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA04 geometry and integration suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa04/Headless/QA04.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R07 bounded spinner components
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R07DevelopmentChecks/R07DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA05 spinner suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa05/Headless/QA05.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R08 bounded legacy ledger controls
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R08DevelopmentChecks/R08DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R08-C01 spinner presentation and input continuity
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R08C01DevelopmentChecks/R08C01DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R08-C02 automatic chart score multiplier
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R08C02DevelopmentChecks/R08C02DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA06 ledger multiplier and presentation suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa06/Headless/QA06.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R09 bounded health calibration and integration
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R09DevelopmentChecks/R09DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA07 health calibration drain and failure suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa07/Headless/QA07.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R10 fresh ordinary NewCombo preparation
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R10DevelopmentChecks/R10DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA08 NewCombo and fresh health integration suite
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/qa/qa08/Headless/QA08.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R11 circle hitsound selection resources and lifecycle
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R11DevelopmentChecks/R11DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $packPath = Join-Path $env:RUNNER_TEMP 'ohno-r11-independent-tones'
          & ./reconstructed/GenerateIndependentHitSounds.ps1 -PackDirectory $packPath
          $samples = @(Get-ChildItem $packPath -Filter '*.wav')
          if ($samples.Count -ne 12) { throw 'Expected twelve independent sample files.' }
          foreach ($sample in $samples) {
            $bytes = [IO.File]::ReadAllBytes($sample.FullName)
            if ($bytes.Length -ne 10628 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'RIFF') {
              throw 'Independent generator PCM header/length mismatch.'
            }
          }
          Write-Output 'R11 INDEPENDENT PACK: 12 PCM WAV files generated and headers checked; no playback'
          Remove-Item $packPath -Recurse
          exit 0

      - name: Execute independent QA09 circle hitsound suite without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa09/Run-QA09.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa09-results.json')
          exit $LASTEXITCODE

      - name: Check R12 discrete slider hitsounds without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          $packPath = Join-Path $env:RUNNER_TEMP 'ohno-r12-independent-tones'
          & ./reconstructed/GenerateIndependentHitSounds.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderTicks.ps1 -PackDirectory $packPath
          if (@(Get-ChildItem $packPath -Filter '*.wav').Count -ne 15) { throw 'Expected twelve circle plus three tick samples.' }
          foreach ($sample in @(Get-ChildItem $packPath -Filter '*-slidertick.wav')) {
            $bytes = [IO.File]::ReadAllBytes($sample.FullName)
            if ($bytes.Length -ne 10628 -or [Text.Encoding]::ASCII.GetString($bytes, 0, 4) -ne 'RIFF') { throw 'R12 PCM header/length mismatch.' }
          }
          Write-Output 'R12 INDEPENDENT TICKS: 3 PCM WAV files generated and headers checked; old 12 names retained; no playback'
          dotnet run --project reconstructed/R12DevelopmentChecks/R12DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE" $packPath
          $resultCode = $LASTEXITCODE
          Remove-Item $packPath -Recurse
          exit $resultCode

      - name: Execute independent QA10 discrete slider suite without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa10/Run-QA10.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa10-results.json')
          exit $LASTEXITCODE

      - name: Check R13 shared continuing channels without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          $packPath = Join-Path $env:RUNNER_TEMP 'ohno-r13-independent-tones'
          & ./reconstructed/GenerateIndependentHitSounds.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderTicks.ps1 -PackDirectory $packPath
          $before = @{}
          Get-ChildItem $packPath -Filter '*.wav' | ForEach-Object { $before[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          & ./reconstructed/GenerateIndependentSliderLoops.ps1 -PackDirectory $packPath
          if (@(Get-ChildItem $packPath -Filter '*.wav').Count -ne 21) { throw 'Expected21 independent samples.' }
          foreach ($name in $before.Keys) { if ((Get-FileHash (Join-Path $packPath $name) -Algorithm SHA256).Hash -ne $before[$name]) { throw 'Historical generated sample changed.' } }
          dotnet run --project reconstructed/R13DevelopmentChecks/R13DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE" $packPath
          $resultCode = $LASTEXITCODE
          Remove-Item $packPath -Recurse
          exit $resultCode

      - name: Check R13 Windows empty-resource lifecycle without opening media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R13WindowsChecks/R13WindowsChecks.csproj -c Release
          exit $LASTEXITCODE

      - name: Execute independent QA11 shared channels without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa11/Run-QA11.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa11-results.json')
          exit $LASTEXITCODE

      - name: Check R13-C01 captured settings gain without playback
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R13C01DevelopmentChecks/R13C01DevelopmentChecks.csproj -c Release
          exit $LASTEXITCODE

      - name: Check R14 spinner audio with recording channels and independent assets
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          $packPath = Join-Path $env:RUNNER_TEMP 'ohno-r14-independent-tones'
          & ./reconstructed/GenerateIndependentHitSounds.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderTicks.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderLoops.ps1 -PackDirectory $packPath
          $before = @{}
          Get-ChildItem $packPath -Filter '*.wav' | ForEach-Object { $before[$_.Name] = (Get-FileHash $_.FullName -Algorithm SHA256).Hash }
          & ./reconstructed/GenerateIndependentSpinnerSounds.ps1 -PackDirectory $packPath
          if (@(Get-ChildItem $packPath -Filter '*.wav').Count -ne 23) { throw 'Expected23 independent sample files.' }
          foreach ($name in $before.Keys) { if ((Get-FileHash (Join-Path $packPath $name) -Algorithm SHA256).Hash -ne $before[$name]) { throw 'Historical sample fingerprint changed.' } }
          dotnet run --project reconstructed/R14DevelopmentChecks/R14DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE" $packPath
          $resultCode = $LASTEXITCODE
          Remove-Item $packPath -Recurse
          exit $resultCode

      - name: Check R14 Windows unsupported-frequency capability without media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R14WindowsChecks/R14WindowsChecks.csproj -c Release
          exit $LASTEXITCODE

      - name: Execute independent QA12 spinner audio without media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa12/Run-QA12.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa12-results.json')
          exit $LASTEXITCODE

      - name: Check R14-Q01 routing and diagnostics without opening media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          $packPath = Join-Path $env:RUNNER_TEMP 'ohno-r14-q01-pack'
          & ./reconstructed/GenerateIndependentHitSounds.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderTicks.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSliderLoops.ps1 -PackDirectory $packPath
          & ./reconstructed/GenerateIndependentSpinnerSounds.ps1 -PackDirectory $packPath
          dotnet run --project reconstructed/R14Q01DevelopmentChecks/R14Q01DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE" $packPath
          $resultCode = $LASTEXITCODE
          Remove-Item $packPath -Recurse
          exit $resultCode

      - name: Check R15 original-derived Rank model without media or windows
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R15DevelopmentChecks/R15DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R15 WPF host and widgets without showing a Window
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R15WindowsChecks/R15WindowsChecks.csproj -c Release
          exit $LASTEXITCODE

      - name: Execute independent QA13 Rank results without windows or media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa13/Run-QA13.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa13-results.json')
          exit $LASTEXITCODE

      - name: Check R16 local catalog selection and Play capture without windows/media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R16DevelopmentChecks/R16DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R16 unshown SelectPlay widgets and Rank-return host boundaries
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R16WindowsChecks/R16WindowsChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Execute independent QA14 catalog selection and entry controls without windows/media
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          & ./re/qa/qa14/Run-QA14.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'qa14-results.json')
          exit $LASTEXITCODE

      - name: Check R17 restricted circle mathematics against independent E045 E046 data
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R17DevelopmentChecks/R17DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check R17 unshown calculated-star browser and Rank boundaries
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/R17WindowsChecks/R17WindowsChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check C001 canonical syntax and versioned Bezier preparation
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/C001DevelopmentChecks/C001DevelopmentChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE"
          exit $LASTEXITCODE

      - name: Check C001 finite Perfect-circle geometry and consumers
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project reconstructed/C001PerfectChecks/C001PerfectChecks.csproj -c Release -- "$env:GITHUB_WORKSPACE" "${{ runner.temp }}/c001-perfect-results.json"
          exit $LASTEXITCODE

      - name: Preserve independent finite stacking regression
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/campaigns/C001/stacking/Headless/C001.Stacking.csproj -c Release -- "$env:GITHUB_WORKSPACE" "${{ runner.temp }}/c001-stacking-heads.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project re/campaigns/C001/stacking/Integration/C001.StackingIntegration.csproj -c Release -- "$env:GITHUB_WORKSPACE" "${{ runner.temp }}/c001-stacking-integration.json"
          exit $LASTEXITCODE

      - name: Publish C001 Windows x64 application for owner qualification
        if: ${{ success() }}
        shell: pwsh
        run: |
          dotnet publish reconstructed/CircleGame/Ohno.CircleGame.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "${{ runner.temp }}/ohno-c001-windows"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Set-Content "${{ runner.temp }}/ohno-c001-windows/SOURCE-COMMIT.txt"
          Copy-Item reconstructed/campaigns/C001/corpus "${{ runner.temp }}/ohno-c001-windows/C001Corpus" -Recurse
          Copy-Item reconstructed/campaigns/C001/corpus-manifest.json "${{ runner.temp }}/ohno-c001-windows/"
          Copy-Item re/campaigns/C001/perfect-circle/fixtures "${{ runner.temp }}/ohno-c001-windows/C001PerfectCorpus" -Recurse
          Copy-Item re/campaigns/C001/perfect-circle/manifest.json "${{ runner.temp }}/ohno-c001-windows/PERFECT-MANIFEST.json"
          Copy-Item reconstructed/campaigns/C001/perfect-development/HUMAN.md "${{ runner.temp }}/ohno-c001-windows/PERFECT-QUALIFICATION.md"
          Copy-Item reconstructed/campaigns/C001/human-qualification.md "${{ runner.temp }}/ohno-c001-windows/"

      - name: Verify independent C001 finite original-contract predictions
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        shell: pwsh
        run: |
          dotnet run --project re/campaigns/C001/verification/Headless/C001.Headless.csproj -c Release -- "$env:GITHUB_WORKSPACE" "${{ runner.temp }}/c001-independent-results.json"
          exit $LASTEXITCODE

      - name: Preserve C001 development evidence and Windows application
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ohno-C001-${{ github.sha }}
          path: |
            ${{ runner.temp }}/ohno-c001-windows/
            reconstructed/campaigns/C001/development-results.json
            ${{ runner.temp }}/c001-independent-results.json
            ${{ runner.temp }}/c001-perfect-results.json
            ${{ runner.temp }}/c001-stacking-heads.json
            ${{ runner.temp }}/c001-stacking-integration.json
          if-no-files-found: warn
